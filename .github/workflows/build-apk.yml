name: Build APK

# Every push builds an installable APK and publishes it as a GitHub release,
# so the app can be installed straight from a phone: open the repo's
# Releases page, tap the newest "Daily Spark build", download the .apk.
on:
  push:
    branches: ['**']
    # Docs-only changes don't need a new APK.
    paths-ignore:
      - 'docs/**'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Pushes less than 5 minutes apart: only the last one is built. Older runs
  # of this branch started within 5 minutes before this one are cancelled;
  # older ones keep going (they may be about to publish).
  supersede:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Cancel builds superseded within 5 minutes
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          RUN_ID: ${{ github.run_id }}
        run: |
          this=$(gh api "repos/$REPO/actions/runs/$RUN_ID" --jq .created_at)
          this_s=$(date -d "$this" +%s)
          gh api "repos/$REPO/actions/workflows/build-apk.yml/runs?branch=$BRANCH&per_page=30" \
            --jq '.workflow_runs[] | select(.status != "completed") | "\(.id) \(.created_at)"' |
          while read -r id created; do
            [ "$id" = "$RUN_ID" ] && continue
            age=$(( this_s - $(date -d "$created" +%s) ))
            if [ "$age" -ge 0 ] && [ "$age" -lt 300 ]; then
              echo "Cancelling run $id (started ${age}s before this one)"
              gh api -X POST "repos/$REPO/actions/runs/$id/cancel" || true
            fi
          done

  # Does this push need a new APK? Only when native code changed (the
  # Expo fingerprint of the Android app) or the watch app changed; everything
  # else reaches the phone as an over-the-air update.
  plan:
    needs: supersede
    runs-on: ubuntu-latest
    outputs:
      native: ${{ steps.decide.outputs.native }}
      fingerprint: ${{ steps.decide.outputs.fingerprint }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Compare with the last published APK
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FP=$(npx @expo/fingerprint fingerprint:generate --platform android | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s).hash))")
          echo "fingerprint=$FP" >> "$GITHUB_OUTPUT"
          LAST=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1 --json tagName -q '.[0].tagName' || true)
          BODY=$( [ -n "$LAST" ] && gh release view "$LAST" --repo "$GITHUB_REPOSITORY" --json body -q .body || true)
          PREV_FP=$(echo "$BODY" | sed -n 's/^fingerprint: //p' | head -1)
          PREV_SHA=$(echo "$BODY" | sed -n 's/^commit: //p' | head -1)
          NATIVE=true
          if [ "${{ github.event_name }}" != "workflow_dispatch" ] && [ -n "$PREV_FP" ] && [ "$PREV_FP" = "$FP" ] \
             && [ -n "$PREV_SHA" ] && git cat-file -e "$PREV_SHA" 2>/dev/null && git diff --quiet "$PREV_SHA" HEAD -- wear/; then
            NATIVE=false
          fi
          echo "native=$NATIVE" >> "$GITHUB_OUTPUT"
          echo "Fingerprint $FP (last APK: ${PREV_FP:-none} at ${PREV_SHA:-?}) → new APK needed: $NATIVE"

  # Over-the-air update for the app's JavaScript (EAS Update), every push.
  # Needs the EXPO_TOKEN secret; without it, this job does nothing.
  update:
    needs: plan
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v5
        if: env.EXPO_TOKEN != ''

      - uses: actions/setup-node@v5
        if: env.EXPO_TOKEN != ''
        with:
          node-version: 22
          cache: npm

      - run: npm ci
        if: env.EXPO_TOKEN != ''

      - name: Typecheck, lint, unit tests
        if: env.EXPO_TOKEN != ''
        run: npx tsc --noEmit && npx expo lint && npm test

      # First run only: create the EAS project and print its id, to be committed to app.json.
      - name: Link the EAS project
        id: link
        if: env.EXPO_TOKEN != ''
        run: |
          if node -e 'process.exit(require("./app.json").expo.extra?.eas?.projectId ? 0 : 1)'; then
            echo "linked=true" >> "$GITHUB_OUTPUT"
          else
            npx eas-cli@latest init --non-interactive --force
            node -e 'const e=require("./app.json").expo; console.log("EAS projectId:", e.extra?.eas?.projectId, "owner:", e.owner)'
            echo "::notice::EAS project created. Commit its projectId and owner to app.json to turn on updates."
            echo "linked=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish the update
        if: env.EXPO_TOKEN != '' && steps.link.outputs.linked == 'true'
        run: |
          npx eas-cli@latest channel:create production --non-interactive || true
          npx eas-cli@latest update --branch production --platform android --non-interactive \
            --message "$(git log -1 --pretty=%s)"

  # The phone app, one job per CPU type in parallel (arm64 for phones, x86_64
  # for the emulator smoke test), so each compiles native code only once.
  phone:
    needs: plan
    if: needs.plan.outputs.native == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      matrix:
        abi: [arm64-v8a, x86_64]
    # One build at a time per branch and CPU type; a newer one waits instead of cancelling.
    concurrency:
      group: apk-${{ github.ref }}-${{ matrix.abi }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck, lint, unit tests
        if: matrix.abi == 'arm64-v8a'
        run: npx tsc --noEmit && npx expo lint && npm test

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # Save Gradle's caches from every branch (by default only the default branch
      # writes them, so builds on this branch always started cold).
      - uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: false

      # Each build gets a higher versionCode so it installs over the previous one.
      - name: Set version code
        run: |
          node -e '
            const fs = require("fs");
            const app = JSON.parse(fs.readFileSync("app.json", "utf8"));
            app.expo.android.versionCode = Number(process.env.GITHUB_RUN_NUMBER);
            fs.writeFileSync("app.json", JSON.stringify(app, null, 2));
          '

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install

      # Release build, signed with the project's fixed key (android/app/debug.keystore
      # from the template), so updates install over each other and keep your data.
      # R8 minification is off (app.json): it stripped WorkManager's database class
      # and crashed the app on launch. --build-cache reuses unchanged modules.
      - name: Build APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --build-cache -PreactNativeArchitectures=${{ matrix.abi }}

      # One APK per CPU type (plugins/withAbiSplits.js).
      - name: Rename APK
        run: |
          if [ "${{ matrix.abi }}" = "arm64-v8a" ]; then OUT="daily-spark-${GITHUB_RUN_NUMBER}.apk"; else OUT="emulator-x86_64-${GITHUB_RUN_NUMBER}.apk"; fi
          cp "android/app/build/outputs/apk/release/app-${{ matrix.abi }}-release.apk" "$OUT"
          ls -lh *.apk

      - uses: actions/upload-artifact@v5
        with:
          name: apk-${{ matrix.abi }}
          path: '*.apk'
          retention-days: 14

  # Watch app (Wear OS Tile, complication, pace guide, strength), in parallel.
  # Signed with the phone app's key (from prebuild) so the Data Layer connects
  # them. A failure here doesn't block the phone APK.
  watch:
    needs: plan
    if: needs.plan.outputs.native == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Only for android/app/debug.keystore (the shared signing key).
      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.11.1"
          cache-read-only: false

      - name: Build watch APK
        run: |
          gradle -p wear :app:assembleRelease --no-daemon --build-cache
          cp wear/app/build/outputs/apk/release/app-release.apk "daily-spark-watch-${GITHUB_RUN_NUMBER}.apk"

      - uses: actions/upload-artifact@v5
        with:
          name: apk-watch
          path: daily-spark-watch-*.apk
          retention-days: 14

  # Opens the APK on an Android 14 emulator; fails if the app crashes on launch.
  smoke-test:
    needs: phone
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v5
        with:
          name: apk-x86_64

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Launch on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          # The launch check gates publishing; the walkthrough only reports.
          script: ./scripts/smoke-test.sh "emulator-x86_64-${GITHUB_RUN_NUMBER}.apk" || exit 1; ./scripts/walkthrough.sh > walkthrough.log 2>&1 || touch walkthrough-failed; cat walkthrough.log || true

      - name: Report walkthrough
        if: always()
        run: |
          if [ -f walkthrough-failed ]; then
            echo "::warning::Emulator walkthrough failed. See walkthrough.log and shots/ in the smoke-test-logs artifact."
            cat walkthrough.log || true
          fi

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: smoke-test-logs
          path: |
            logcat.txt
            screenshot.png
            ui.xml
            walkthrough.log
            shots/

  # Publishes once the phone APK passed the emulator check; the watch APK is
  # added when its build worked.
  publish:
    needs: [plan, phone, smoke-test, watch]
    if: ${{ !cancelled() && needs.phone.result == 'success' && needs.smoke-test.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: apk-arm64-v8a

      - uses: actions/download-artifact@v5
        continue-on-error: true
        with:
          name: apk-watch

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          WATCH=""
          if [ -f "daily-spark-watch-${GITHUB_RUN_NUMBER}.apk" ]; then WATCH="daily-spark-watch-${GITHUB_RUN_NUMBER}.apk"; fi
          gh release create "build-${GITHUB_RUN_NUMBER}" "daily-spark-${GITHUB_RUN_NUMBER}.apk" $WATCH \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --prerelease \
            --title "Daily Spark build ${GITHUB_RUN_NUMBER} (${GITHUB_REF_NAME})" \
            --notes "Built from \`${GITHUB_REF_NAME}\` at ${GITHUB_SHA}. Download the .apk on your phone to install or update.

          fingerprint: ${{ needs.plan.outputs.fingerprint }}
          commit: ${GITHUB_SHA}"
