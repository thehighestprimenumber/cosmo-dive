name: Build APK

# Every push builds an installable APK and publishes it as a GitHub release,
# so the app can be installed straight from a phone: open the repo's
# Releases page, tap the newest "Daily Spark build", download the .apk.
on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npx expo lint

      - name: Unit tests
        run: npm test

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5

      # Each build gets a higher versionCode so it installs over the previous one.
      - name: Set version code
        run: |
          node -e '
            const fs = require("fs");
            const app = JSON.parse(fs.readFileSync("app.json", "utf8"));
            app.expo.android.versionCode = Number(process.env.GITHUB_RUN_NUMBER);
            fs.writeFileSync("app.json", JSON.stringify(app, null, 2));
          '

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install

      # Release build, signed with the project's fixed key (android/app/debug.keystore
      # from the template), so updates install over each other and keep your data.
      # R8 minification is off (app.json): it stripped WorkManager's database class
      # and crashed the app on launch.
      # arm64 for real phones, x86_64 so the emulator smoke test can run it.
      - name: Build APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,x86_64

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk "daily-spark-${GITHUB_RUN_NUMBER}.apk"

      - uses: actions/upload-artifact@v5
        with:
          name: daily-spark-apk
          path: daily-spark-*.apk
          retention-days: 14

  # Opens the APK on an Android 14 emulator; fails if the app crashes on launch.
  smoke-test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v5
        with:
          name: daily-spark-apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Launch on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: ./scripts/smoke-test.sh "$(ls daily-spark-*.apk | head -1)"

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: smoke-test-logs
          path: |
            logcat.txt
            screenshot.png
            ui.xml

  publish:
    needs: [build, smoke-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: daily-spark-apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${GITHUB_RUN_NUMBER}" "daily-spark-${GITHUB_RUN_NUMBER}.apk" \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --prerelease \
            --title "Daily Spark build ${GITHUB_RUN_NUMBER} (${GITHUB_REF_NAME})" \
            --notes "Built from \`${GITHUB_REF_NAME}\` at ${GITHUB_SHA}. Download the .apk on your phone to install or update."
